<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Client Portal — Social Fire Solutions</title>
<link rel="icon" type="image/png" href="/media/favicon.png">
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --onyx:#0A0A0B; --carbon:#161618; --carbon-2:#1F1F22;
  --deep:#1E5AC8; --bright:#1B8CF2; --sky:#7FE0FF;
  --ivory:#F4F1EA; --ash:#9A9AA0; --line:#2a2a2e;
  --burn:linear-gradient(100deg,#7FE0FF,#1B8CF2 50%,#1E5AC8);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 80% at 14% 0%, rgba(27,140,242,.12), transparent 55%),
    radial-gradient(120% 90% at 86% 100%, rgba(30,90,200,.14), transparent 60%),
    linear-gradient(180deg,#0A0A0B,#0d0d10 60%,#08080a);
  color:var(--ivory); font-family:'Inter',system-ui,sans-serif; font-size:18px;
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
.fire{background:var(--burn);-webkit-background-clip:text;background-clip:text;color:transparent}
.flame{width:26px;height:26px;flex:none;background:var(--burn);border-radius:50% 50% 50% 0;transform:rotate(45deg);box-shadow:0 0 20px rgba(27,140,242,.6)}

/* ---------- gate ---------- */
#gate{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;letter-spacing:.02em;margin-bottom:34px}
.brand .co{color:var(--ash);font-weight:400}
#gate h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(2rem,6vw,3rem);line-height:1.14;margin-bottom:10px}
#gate .sub{color:var(--ash);font-size:1.05rem;margin-bottom:34px}
.gatecard{width:100%;max-width:400px;background:var(--carbon);border:1px solid var(--line);border-radius:18px;padding:30px 26px 26px}
.gatecard label{display:block;text-align:left;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);font-weight:600;margin-bottom:8px}
#clientName{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:15px 16px;color:var(--ivory);font-family:'Inter';font-size:1.05rem;margin-bottom:24px}
#clientName:focus{outline:none;border-color:var(--bright);background:rgba(27,140,242,.06)}
.dots{display:flex;justify-content:center;gap:16px;margin-bottom:22px}
.dot{width:16px;height:16px;border-radius:50%;border:1.6px solid var(--ash);transition:.2s}
.dot.on{background:var(--burn);border-color:var(--sky);box-shadow:0 0 12px rgba(27,140,242,.6)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;
  color:var(--ivory);font-family:'Inter';font-size:1.5rem;font-weight:600;padding:16px 0;
  cursor:pointer;transition:.15s var(--ease);
}
.pad button:hover{border-color:var(--bright);background:rgba(27,140,242,.08)}
.pad button:active{transform:scale(.96)}
.pad .ghost{font-size:1rem;color:var(--ash)}
#gateErr{color:#e0705f;font-size:.95rem;margin-top:18px;min-height:1.4em}
#gateBusy{color:var(--ash);font-size:.95rem;margin-top:18px;min-height:1.4em;display:none}

/* ---------- chat ---------- */
#chat{display:none;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto}
.chathead{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.chathead .who{flex:1}
.chathead .who b{display:block;font-size:1.02rem}
.chathead .who span{color:var(--ash);font-size:.85rem}
.chathead a{color:var(--ash);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);border-radius:50px;padding:8px 14px}
.chathead a:hover{border-color:var(--bright);color:var(--bright)}
#msgs{flex:1;overflow-y:auto;padding:26px 20px;display:flex;flex-direction:column;gap:16px}
.m{max-width:82%;padding:14px 18px;border-radius:16px;font-size:1.02rem;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.m.ai{align-self:flex-start;background:var(--carbon);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.me{align-self:flex-end;background:linear-gradient(100deg,rgba(127,224,255,.16),rgba(27,140,242,.18));border:1px solid rgba(27,140,242,.4);border-bottom-right-radius:4px}
.filedpill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgba(27,140,242,.12);border:1px solid rgba(27,140,242,.5);color:var(--sky);border-radius:50px;padding:7px 16px;font-size:.85rem;font-weight:600}
.typing{align-self:flex-start;color:var(--ash);font-size:.95rem;display:none}
.typing.show{display:block}
.inputrow{display:flex;gap:10px;padding:16px 20px 22px;border-top:1px solid var(--line)}
#box{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:15px 16px;color:var(--ivory);font-family:'Inter';font-size:1.02rem;resize:none;max-height:140px}
#box:focus{outline:none;border-color:var(--bright)}
#send{background:var(--burn);color:#0A0A0B;border:none;border-radius:14px;font-family:'Inter';font-weight:700;font-size:1rem;padding:0 26px;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
@media (max-width:600px){ .m{max-width:92%} }
</style>
</head>
<body>

<!-- GATE -->
<section id="gate">
  <div class="brand"><div class="flame"></div>SOCIAL FIRE <span class="co">SOLUTIONS</span></div>
  <h1>Start building <em class="fire">your dream.</em></h1>
  <p class="sub">Bring your vision to life — enter your name and client code.</p>
  <div class="gatecard">
    <label for="clientName">Your name</label>
    <input id="clientName" type="text" autocomplete="name" placeholder="e.g. Josue" />
    <label>Client code</label>
    <div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div></div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="ghost" data-k="clear">clear</button><button data-k="0">0</button><button class="ghost" data-k="del">⌫</button>
    </div>
    <div id="gateErr"></div>
    <div id="gateBusy">Checking…</div>
  </div>
</section>

<!-- CHAT -->
<section id="chat">
  <div class="chathead">
    <div class="flame"></div>
    <div class="who"><b>Social Fire <span class="fire">AI</span></b><span id="whoSite">your concierge</span></div>
    <a href="#" id="logout">Sign out</a>
  </div>
  <div id="msgs">
    <div class="typing" id="typing">Social Fire AI is thinking…</div>
  </div>
  <div class="inputrow">
    <textarea id="box" rows="1" placeholder="Tell me what you'd like to change…"></textarea>
    <button id="send">Send</button>
  </div>
</section>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var LS = "sfs_portal";
  var state = { code:"", name:"", client:null, history:[] };

  /* ---------- gate ---------- */
  var entered = "";
  function paint(){ for(var i=0;i<3;i++) $("d"+i).classList.toggle("on", i < entered.length); }
  $("pad").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    var k = b.getAttribute("data-k");
    if(k === "clear"){ entered = ""; }
    else if(k === "del"){ entered = entered.slice(0,-1); }
    else if(entered.length < 3){ entered += k; }
    paint();
    if(entered.length === 3) tryLogin();
  });

  function tryLogin(){
    var name = $("clientName").value.trim();
    if(!name){ $("gateErr").textContent = "Add your name first, then your code."; entered=""; paint(); return; }
    $("gateErr").textContent = ""; $("gateBusy").style.display = "block";
    fetch("/api/portal-chat", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ action:"login", code: entered, name: name })
    }).then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
    .then(function(res){
      $("gateBusy").style.display = "none";
      if(!res.j.ok){ $("gateErr").textContent = "That name and code don't match. Check with Cameron if you need your code."; entered=""; paint(); return; }
      state.code = entered; state.name = name; state.client = res.j.client;
      try{ localStorage.setItem(LS, JSON.stringify({code:state.code, name:state.name})); }catch(_){}
      openChat(res.j.greeting);
    }).catch(function(){
      $("gateBusy").style.display = "none";
      $("gateErr").textContent = "Couldn't reach the portal — try again."; entered=""; paint();
    });
  }

  /* ---------- chat ---------- */
  function openChat(greeting){
    $("gate").style.display = "none";
    $("chat").style.display = "flex";
    $("whoSite").textContent = state.client && state.client.site
      ? "building for " + state.client.site.replace(/^https?:\/\//,"")
      : "your website concierge";
    if(greeting && !state.history.length) addMsg("ai", greeting);
    $("box").focus();
  }

  function addMsg(kind, text){
    var el = document.createElement("div");
    el.className = "m " + (kind === "me" ? "me" : "ai");
    el.textContent = text;
    $("msgs").insertBefore(el, $("typing"));
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }
  function addFiled(){
    var el = document.createElement("div");
    el.className = "filedpill";
    el.textContent = "🔵 Request filed with the build team";
    $("msgs").insertBefore(el, $("typing"));
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }

  var sending = false;
  function send(){
    if(sending) return;
    var text = $("box").value.trim();
    if(!text) return;
    $("box").value = "";
    addMsg("me", text);
    state.history.push({ role:"user", content:text });
    sending = true; $("send").disabled = true; $("typing").classList.add("show");
    fetch("/api/portal-chat", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ action:"chat", code: state.code, name: state.name, messages: state.history })
    }).then(function(r){ return r.json(); })
    .then(function(j){
      sending = false; $("send").disabled = false; $("typing").classList.remove("show");
      if(!j.ok){
        addMsg("ai", j.error === "not_configured"
          ? "The concierge isn't switched on yet — Cameron is finishing setup."
          : "Something hiccuped on my end — try that again?");
        return;
      }
      if(j.filed) addFiled();
      addMsg("ai", j.reply);
      state.history.push({ role:"assistant", content:j.reply });
    }).catch(function(){
      sending = false; $("send").disabled = false; $("typing").classList.remove("show");
      addMsg("ai", "Connection dropped — try that again?");
    });
  }
  $("send").addEventListener("click", send);
  $("box").addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  $("logout").addEventListener("click", function(e){
    e.preventDefault();
    try{ localStorage.removeItem(LS); }catch(_){}
    location.reload();
  });

  /* ---------- resume ---------- */
  try{
    var saved = JSON.parse(localStorage.getItem(LS) || "null");
    if(saved && saved.code && saved.name){
      $("clientName").value = saved.name;
      fetch("/api/portal-chat", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ action:"login", code: saved.code, name: saved.name })
      }).then(function(r){ return r.json(); }).then(function(j){
        if(j.ok){ state.code = saved.code; state.name = saved.name; state.client = j.client; openChat(j.greeting); }
      }).catch(function(){});
    }
  }catch(_){}
})();
</script>
</body>
</html>
